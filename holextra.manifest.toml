[holbuild]
schema = 2

[project]
name = "holextra"
version = "0.1.0"

[build]
members = [
  "src/transfer/examples",
  "examples/formal-languages",
  "examples/algorithms",
  "examples/data-structures",
  "examples/pl-semantics/lprefix_lub",
  "examples/machine-code/multiword",
  "examples/machine-code/hoare-triple",
  "examples/machine-code/decompiler",
  "examples/l3-machine-code"
]
exclude = ["examples/l3-machine-code/monadic-arm"]
exclude_globs = ["*/selftest.sml"]

[actions.MutableMap16]
loads = ["Ptree", "Map", "MutableMapFunctor"]

[actions.arm8]
loads = ["assemblerLib", "MutableMap16"]

[actions.FP32]
loads = ["FP"]

[actions.FP64]
loads = ["FP"]

[actions.arm]
loads = ["assemblerLib", "MutableMap16"]

[actions.mips]
loads = ["assemblerLib", "MutableMap16"]

[actions.x64]
loads = ["assemblerLib", "MutableMap16"]
