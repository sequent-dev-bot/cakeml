[holbuild]
schema = 2
minimum_version = "0.11.7"

[project]
name = "cakeml-compiler"
version = "0.1.1"

[build]
roots = ["compiler/proofs/compilerProofScript.sml"]
exclude = ["candle/overloading",
           "compiler/benchmarks",
           "compiler/bootstrap",
           "translator/other-examples",
           "unverified/front-end",
           "unverified/hol-light-syntax",
           "unverified/ocaml-syntax",
           "unverified/sexpr-bootstrap/export",
           "unverified/sexpr-bootstrap/x64",
           "tutorial",
           "examples"]

[dependencies.hol]
git = "https://github.com/HOL-Theorem-Prover/HOL.git"
rev = "9783a49979c94c401ff8c0e51b2eefae7ea95ae3"

[dependencies.holextra]
from = "hol"
path = "."
manifest = "holextra.manifest.toml"

